appId: dev.androidagentlab.desktop
productName: Android Agent Lab
copyright: Copyright © 2026 Android Agent Lab contributors
asar: true
npmRebuild: false
directories:
  output: dist
  buildResources: build
files:
  - app/**
  - package.json
extraResources:
  - from: ../.desktop-build/runtime
    to: runtime
linux:
  executableName: android-agent-lab
  syncDesktopName: true
  category: Development
  synopsis: Shared Android devices and agent cursors
  icon: build/icons
  maintainer: Hashim <42354949+Hashim-K@users.noreply.github.com>
  artifactName: Android-Agent-Lab-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.gz
  desktop:
    entry:
      Name: Android Agent Lab
      Comment: Shared Android devices, scrcpy video, and visible agent cursors
      StartupWMClass: android-agent-lab
      Keywords: Android;ADB;Emulator;scrcpy;Codex;Claude;
deb:
  depends:
    - python3 (>= 3.10)
    - adb
    - avahi-utils
    - libgtk-3-0
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2 (>= 1.0.17)
rpm:
  depends:
    - python3 >= 3.10
    - /usr/bin/adb
    - /usr/bin/avahi-browse
    - libgtk-3.so.0()(64bit)
    - libnss3.so()(64bit)
    - libXss.so.1()(64bit)
    - libXtst.so.6()(64bit)
    - xdg-utils
    - libatspi.so.0()(64bit)
    - libuuid.so.1()(64bit)
    - libsecret-1.so.0()(64bit)
    - libgbm.so.1()(64bit)
    - libasound.so.2()(64bit)
pacman:
  artifactName: Android-Agent-Lab-${version}-${arch}.pkg.tar.zst
  compression: zstd
  # v26 inserts a Debian-style multiline description; PKGINFO needs one line.
  fpm:
    - --description
    - Shared Android devices, scrcpy video, and visible agent cursors
  depends:
    - python
    - android-tools
    - avahi
    - gtk3
    - nss
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - util-linux-libs
    - libsecret
    - libglvnd
    - mesa
    - alsa-lib
